<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GameLoop{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1100px; margin: 30px auto; padding: 0 18px; line-height: 1.5; color: #222; }
        nav a { margin-right: 12px; }
        article, section.card { border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin: 14px 0; }
        img.avatar { max-width: 110px; max-height: 110px; object-fit: cover; }
        small { color: #555; }
    </style>
</head>
<body>
<header>
    <h1><a href="{% url 'index' %}">GameLoop</a></h1>
    <nav>
        <a href="{% url 'usuarios' %}">Usuarios</a>
        <a href="{% url 'juegos' %}">Juegos</a>
        <a href="{% url 'grupos' %}">Grupos</a>
        <a href="{% url 'noticias' %}">Noticias</a>
        <a href="{% url 'estadisticas' %}">Estadísticas</a>
    </nav>
    <hr>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
